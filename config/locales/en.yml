# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"
  recipes:
    conflict: "Someone else changed this recipe in the meantime. Reload and try again."
  variations:
    conflict: "Someone else changed this variation in the meantime. Reload and try again."
  errors:
    messages:
      too_many: "has too many rows (maximum is %{count})"
      too_many_rows: "has too many rows"
      reserved: "cannot be \"%{name}\", that name is reserved"
  activerecord:
    errors:
      models:
        recipe:
          attributes:
            tag_names:
              too_many_tags: "has too many tags (maximum is %{count})"
              tag_too_long: "has a tag that is too long: \"%{name}\" (maximum is %{count} characters)"
              tag_with_comma: "has a tag with a comma: \"%{name}\""
        recipe_variation:
          attributes:
            base:
              too_many_variations: "This recipe already has %{count} variations, the maximum"
            added_tag_names:
              too_many_tags: "are too many (maximum is %{count})"
              tag_on_recipe: "contains \"%{name}\", but the recipe already has that tag"
              tag_too_long: "has a tag that is too long: \"%{name}\" (maximum is %{count} characters)"
              tag_with_comma: "has a tag with a comma: \"%{name}\""
            removed_tag_names:
              tag_not_on_recipe: "contains \"%{name}\", but the recipe does not have that tag"
        variation_change:
          attributes:
            recipe_ingredient:
              other_recipe: "does not belong to this recipe"
              being_removed: "is being removed from the recipe at the same time"
        variation_tag_change:
          attributes:
            tag:
              on_recipe: "is already on the recipe"
              not_on_recipe: "is not on the recipe"
