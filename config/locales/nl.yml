# Dutch names and messages for the API's validation errors. The standard texts
# ("moet opgegeven zijn", "is geen getal") come from the rails-i18n gem.
#
# The API sends messages without the attribute name ({ "title": ["moet opgegeven zijn"] });
# the frontend puts its own label in front. These names are used where Rails builds a
# full message itself (errors.full_messages, the console, logs).
nl:
  # Models without a table (ActiveModel::Model), such as ShoppingListAddition.
  activemodel:
    attributes:
      shopping_list_addition:
        servings: Porties
        ingredient_ids: Ingrediënten
        alternative_ids: Alternatieven
    errors:
      models:
        shopping_list_addition:
          attributes:
            ingredient_ids:
              other_recipe: "bevat een ingrediënt dat niet bij dit recept hoort"
            alternative_ids:
              other_recipe: "bevat een alternatief dat niet bij dit recept hoort"
              one_per_ingredient: "bevat twee alternatieven voor hetzelfde ingrediënt"
  activerecord:
    models:
      recipe: recept
      recipe_ingredient: ingrediënt
      recipe_ingredient_alternative: alternatief
      ingredient: ingrediënt
      nevo_food: NEVO-product
      step: stap
      standard_item: standaarditem
      recipe_version: versie
      shopping_list_item: boodschap
      tag: tag
      recipe_tag: tag van recept
      recipe_variation: variatie
      category: categorie
      variation_change: ingrediëntwijziging
      variation_tag_change: tagwijziging
    attributes:
      recipe:
        title: Titel
        description: Beschrijving
        servings: Porties
        steps: Stappen
        recipe_ingredients: Ingrediënten
        tags: Tags
        tag_names: Tags
        category: Categorie
        category_name: Categorie
        lock_version: Versie
        deletion_reason: Reden
        deletion_requested_at: Verwijderen aangevraagd op
        variations: Variaties
      recipe_variation:
        name: Naam
        notes: Notities
        position: Positie
        lock_version: Versie
        removals: Weggelaten ingrediënten
        removed_ingredient_ids: Weggelaten ingrediënten
        additions: Extra ingrediënten
        added_tag_names: Tags erbij
        removed_tag_names: Tags eraf
        deletion_reason: Reden
        deletion_requested_at: Verwijderen aangevraagd op
      variation_change:
        kind: Soort
        recipe_ingredient: Ingrediënt
        name: Naam
        quantity: Hoeveelheid
        unit: Eenheid
      variation_tag_change:
        kind: Soort
        tag: Tag
      recipe_version:
        recipe: Recept
        snapshot: Inhoud
        summary: Samenvatting
      recipe_ingredient:
        ingredient_name: Naam
        quantity: Hoeveelheid
        unit: Eenheid
        optional: Optioneel
        alternatives: Alternatieven
      recipe_ingredient_alternative:
        ingredient_name: Naam
        quantity: Hoeveelheid
        unit: Eenheid
        recipe_ingredient: Ingrediënt
      ingredient:
        name: Naam
        nevo_food: NEVO-product
        grams_per_piece: Gram per stuk
        grams_per_ml: Gram per ml
        label_kcal: Energie (etiket)
        label_protein: Eiwit (etiket)
        label_carbohydrates: Koolhydraten (etiket)
        label_fat: Vet (etiket)
        label_fiber: Vezels (etiket)
        needs_review: Te controleren
        lock_version: Versie
      nevo_food:
        code: NEVO-code
        name: Naam
        unit: Eenheid
        version: Versie
      step:
        body: Stap
        position: Positie
      standard_item:
        name: Naam
        category: Categorie
      shopping_list_item:
        name: Naam
        quantity: Hoeveelheid
        unit: Eenheid
        source_label: Herkomst
        recipe: Recept
        checked: Afgevinkt
        count: Aantal
      tag:
        name: Naam
        recipes: Recepten
      category:
        name: Naam
        position: Volgorde
        recipes: Recepten
      recipe_tag:
        recipe: Recept
        tag: Tag
    errors:
      models:
        recipe:
          attributes:
            tag_names:
              too_many_tags: "heeft te veel tags (maximaal %{count})"
              tag_too_long: "bevat een te lange tag: \"%{name}\" (maximaal %{count} tekens)"
              tag_with_comma: "bevat een tag met een komma: \"%{name}\""
              automatic_tag: "bevat \"%{name}\", maar die tag volgt automatisch uit de ingrediënten"
        recipe_variation:
          attributes:
            base:
              too_many_variations: "Dit recept heeft al %{count} variaties, het maximum"
            added_tag_names:
              too_many_tags: "zijn er te veel (maximaal %{count})"
              tag_on_recipe: "bevat \"%{name}\", maar die tag heeft het recept al"
              automatic_tag: "bevat \"%{name}\", maar die tag volgt automatisch uit de ingrediënten"
