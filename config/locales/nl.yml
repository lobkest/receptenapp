        recipe_ingredient_alternative:
          attributes:
            ingredient_name:
              same_as_original: "is hetzelfde als het ingrediënt zelf"
              taken: "staat al als alternatief bij dit ingrediënt"
        variation_change:
          attributes:
            recipe_ingredient:
              other_recipe: "hoort niet bij dit recept"
              being_removed: "wordt tegelijk uit het recept gehaald"
        variation_tag_change:
          attributes:
            tag:
              on_recipe: "staat al op het recept"
              not_on_recipe: "staat niet op het recept"
  # Messages the frontend shows as they are (body.error), next to the ones in client.js.
  # The general message ("error") of every API error; see app/controllers/concerns/api_errors.rb.
  api:
    invalid: "Controleer de ingevulde velden."
    not_found: "%{model} niet gevonden."
    route_not_found: "Dit adres bestaat niet."
    parameter_missing: "Er ontbreekt iets in het verzoek: %{param}."
    conflict:
      recipe: "Dit recept is intussen door iemand anders gewijzigd. Herlaad en probeer opnieuw."
      recipe_variation: "Deze variatie is intussen door iemand anders gewijzigd. Herlaad en probeer opnieuw."
      ingredient: "Dit ingrediënt is intussen door iemand anders gewijzigd. Herlaad en probeer opnieuw."
      default: "Dit is intussen door iemand anders gewijzigd. Herlaad en probeer opnieuw."
    too_many_requests: "Te veel verzoeken. Probeer het over een minuut opnieuw."
    too_many_submissions: "Je hebt het afgelopen uur te veel recepten toegevoegd. Probeer het later opnieuw."
    too_many_items: "Maximaal %{count} regels tegelijk."
    bulk_destroy_failed: "Niet alle items konden worden verwijderd, dus er is niets verwijderd."
  admin:
    unauthorized: "De beheercode is onjuist of verlopen."
    rate_limited: "Te veel pogingen. Wacht een minuut en probeer het opnieuw."
    restore_failed: "Deze versie kan niet worden teruggezet: %{reasons}"
  errors:
    messages:
      too_many: "heeft te veel regels (maximaal %{count})"
      too_many_rows: "heeft te veel regels"
      # Category: "Overig" is the heading for recipes without a category.
      reserved: "kan niet \"%{name}\" zijn, die naam is gereserveerd"
