# Eenmalige opschoning van de ingrediënten: bin/rails ingredients:cleanup [DRY_RUN=1].
# Uitleg van de onderdelen: lib/importers/ingredient_cleanup.rb. Gebaseerd op de
# ingrediënten in productie (nevo:auto_link dry-run van 16 oktober 2026).
#
# Een naam die er niet (meer) is, wordt overgeslagen; twee keer draaien is veilig.
# Etiketwaarden staan hier bewust niet in: die vul je zelf in, van het echte etiket.

# "suiker 2tl" was een naam met de hoeveelheid erin: de regels zonder hoeveelheid krijgen
# die hoeveelheid, daarna gaat het op in het gewone ingrediënt.
quantity_in_name:
  suiker 2tl: { into: suiker, quantity: 2, unit: tl }
  zout 2.5 tl: { into: zout, quantity: 2.5, unit: tl }

# Dubbel (bron: doel). Een recept met allebei wordt overgeslagen en gemeld.
merge:
  blauwe bessen: blauwe bes
  chia zaad: chiazaad
  creme fresh: crème fraîche
  trostomaten: trostomaat
  zoete aardappelen: zoete aardappel
  philadelphia: roomkaas

# Een typfout zonder bestaand goed ingrediënt: alleen de naam verandert. Er is geen gewone
# yoghurt (alleen griekse yoghurt en yoghurtsaus), dus "yohgurt" wordt "yoghurt".
rename:
  yohgurt: yoghurt

# Rommel: verwijderd als niets het gebruikt, anders alleen gemeld met waar het staat.
# In productie staan gh en eten in de recepten "Hi" en "Hoi" (vermoedelijk testrecepten):
# die blijven dus staan tot die recepten weg zijn.
junk:
  - gh
  - eten
  - x

# Namen die alleen als extra ingrediënt in een variatie staan, zonder eigen ingrediënt:
# zo krijgen die variaties ook voedingswaarde. kipschnitzel wordt hieronder aangemaakt.
variation_names:
  zalm: zalmfilet

# Per ingrediënt: NEVO-code, gram per stuk, gram per ml, verwaarloosbaar en of het
# gecontroleerd is. Een ingevulde waarde vervangt de huidige. reviewed: false houdt
# "te controleren" aan, met in note wat je zelf moet doen.
ingredients:
  # Verwaarloosbaar: telt als 0. NEVO heeft geen bakpoeder, (dubbelkoolzure) soda of
  # natriumbicarbonaat, geen vanille-extract of vanillesuiker (alleen toetjes) en geen
  # kurkuma (alleen kerriepoeder, een mengsel). Geen etiketwaarden verzonnen.
  bakpoeder: { negligible: true, reviewed: true }
  zuiveringszout: { negligible: true, reviewed: true }
  vanille-extract: { negligible: true, reviewed: true }
  kurkuma: { negligible: true, reviewed: true }

