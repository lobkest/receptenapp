# One-off traits for the existing ingredients, for bin/rails traits:setup. A suggestion in
# the usual Dutch meaning of the word: "kip" is vlees and dierlijk, "feta" dierlijk and
# lactose. Everything is saved as unchecked (traits_checked false), so the ingredients
# page shows it under "Kenmerken te controleren".
#
#   name: [ traits ]                                  no doubt
#   name: { traits: [ traits ], twijfel: "why" }      a doubt, named apart in the report
#
# Traits: vlees, vis (also shellfish), dierlijk (anything from an animal: also egg, milk,
# honey), gluten, lactose, noten (also pinda's). An empty list: none of them.
# Ingredients that are not in here get no suggestion; give them their traits in the app.

