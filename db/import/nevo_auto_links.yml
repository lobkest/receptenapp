# One-off links from the existing ingredients to NEVO-online, for bin/rails nevo:auto_link.
# Only NEVO codes and estimated conversions, no NEVO data itself (that comes from
# nevo:import). Each linked ingredient gets "te controleren" in the app.
#
#   name:  { code: NEVO-code, grams_per_piece: g per stuk, grams_per_ml: g per ml, note: doubt }
#
# grams_per_piece and grams_per_ml are only filled in when the ingredient is used in
# stuks, or in ml/tl/el, and only when still empty. note: why this match is a doubt.
# Ingredients without a sensible NEVO product are left out (bakpoeder, zuiveringszout,
# vissaus, kurkuma, pokesaus, balsamicocrème, vanille-extract, x): link those yourself.

